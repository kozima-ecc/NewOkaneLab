name: flutter_newokanelab # パッケージ名
description: "A new Flutter project." # パッケージの説明
publish_to: 'none' # pub.devへの公開を防ぐ

version: 1.0.0+1 # アプリケーションのバージョン番号

environment:
  sdk: '>=3.9.0 <4.0.0' # Dart SDKのバージョン制約

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0 # グラフ描画ライブラリ
  intl: ^0.19.0 # 国際化ライブラリ

  # iOSスタイルのアイコンフォント
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # コーディング規約をチェックするための推奨Linter
  flutter_lints: ^5.0.0

# Flutter固有の設定
flutter:

  # Material Iconsフォントを有効にする
  uses-material-design: true

  # アセット（画像など）を追加するには、次のように記述します
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # カスタムフォントを追加するには、次のように記述します
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
